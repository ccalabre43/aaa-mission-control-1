<!doctype html>
<html lang="en" data-theme="aaa-life">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- The full 2-color logo, unaltered and proportionally scaled. Not a square app icon: cropping
         the oval out or rebuilding a mark from parts is exactly what the brand guide forbids, so a
         real favicon has to come from the brand team. Without this, every page load logged a 404
         for /favicon.ico. Vite rewrites this path for APP_BASE_PATH at build time. -->
    <link rel="icon" type="image/png" href="/favicon.png" />

    <!-- Internal tool, no public audience. Paired with public/robots.txt. Neither is a security
         control - see docs/deployment.md for where the real boundary is. -->
    <meta name="robots" content="noindex, nofollow" />
    <meta
      name="description"
      content="Mission Control - AAA Life internal creative intake dashboard. Build a creative brief, review it, and track deliverables. All data stays on this device."
    />
    <title>Mission Control | AAA Life</title>
    <!-- Fonts are self-hosted via @fontsource and imported in src/main.tsx.
         No preconnect or stylesheet request goes to Google Fonts or any other third party:
         a font request would leak the user's IP and user agent off-origin, which is a
         privacy review under the company guardrails. -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
